<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cocinas Pro">
<title>Cocinas Pro — Estudio de cocinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#0C0E11;--p1:#13171C;--p2:#1A1F26;--p3:#222831;--ln:#2B323C;--ln2:#3A424E;--tx:#ECE9E3;--mu:#8C949E;--mu2:#6A727C;--ac:#E9A23B;--ac2:#F5C97C;--acbg:rgba(233,162,59,.12);--ok:#5CC28A;--wa:#E9C23B;--er:#EF6A5E;--bl:#5AA7E6;--r:16px;--mono:'JetBrains Mono',ui-monospace,monospace;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Inter Tight',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100dvh;padding-top:var(--sat)}
main,header#top,nav#tabs{min-width:0}
header#top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);background:rgba(12,14,17,.92);backdrop-filter:blur(12px);z-index:5;min-height:56px}
.logo{display:flex;align-items:center;gap:7px;letter-spacing:.06em;font-size:15px}
.logo .mark{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,var(--ac),#B5651D,var(--ac));position:relative}
.logo .mark:after{content:'';position:absolute;inset:6px 5px 5px 6px;border-left:2px solid #0C0E11;border-bottom:2px solid #0C0E11}
.logo b{font-weight:800}.logo i{font-style:normal;color:var(--ac);font-weight:800}
.ver{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;border:1px solid rgba(233,162,59,.45);color:var(--ac2);cursor:pointer;flex:none}
.upd{position:relative}.upd.girando svg{animation:sp .8s linear infinite}
.upd.nueva{background:var(--ac);color:#1A1206;border-color:var(--ac)}.upd.nueva::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--er);border:2px solid var(--bg)}
@media (max-width:440px){.pname{visibility:hidden}}
header#top .ib,header#top .badge{flex:none}.badge{white-space:nowrap}.pill{white-space:nowrap}
.pname{flex:1;min-width:0;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--ln)}
.badge{height:38px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;background:var(--p2);border:1px solid var(--ln)}
.badge .d{width:9px;height:9px;border-radius:50%}
main{overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
main.full{overflow:hidden}
nav#tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ln);background:var(--p1);padding-bottom:var(--sab);z-index:5}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mu);font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
nav#tabs button.on{color:var(--ac)}
nav#tabs button.on:before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:2px;background:var(--ac)}
nav#tabs .n{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--er);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
@media (min-width:900px){
 #app{grid-template-columns:86px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 header#top{grid-column:1/3}
 nav#tabs{grid-row:2;grid-column:1;grid-template-columns:1fr;grid-auto-rows:76px;align-content:start;border-top:0;border-right:1px solid var(--ln);padding-top:8px}
 nav#tabs button.on:before{top:20%;bottom:20%;left:0;right:auto;width:2px;height:auto}
 main{grid-row:2;grid-column:2}
}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:26px;line-height:1.1;margin:4px 0 4px;letter-spacing:-.02em;font-weight:800}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:22px 2px 10px;font-weight:700}
h3{margin:0;font-size:16px;font-weight:700}
.sub{color:var(--mu);font-size:13.5px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g-auto{grid-template-columns:repeat(3,1fr)!important}}
.tile{background:linear-gradient(160deg,var(--p3),var(--p2));border:1px solid var(--ln);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:148px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.98)}
.tile:hover{border-color:var(--ln2)}
.tile .t{font-weight:700;font-size:17px;margin-top:auto}
.tile .s{color:var(--mu);font-size:12.5px}
.tile .ic{color:var(--bl)}
.tile .pv{position:absolute;right:-6px;top:-6px;width:58%;height:70%;opacity:.9;pointer-events:none}
.tile .st{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:7px;background:var(--p1);border:1px solid var(--ln)}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(233,162,59,.18),transparent 55%),var(--p1);border:1px solid var(--ln);border-radius:20px;padding:16px;position:relative;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 10px}
.kpi b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.kpi span{font-size:11px;color:var(--mu)}
.pipe{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pipe span{flex:none;font-size:11.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--ln);color:var(--mu);display:flex;align-items:center;gap:6px}
.pipe span.ok{color:var(--tx);border-color:rgba(92,194,138,.45);background:rgba(92,194,138,.08)}
.pipe span.ok:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pipe span.wip:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--wa)}
.row{display:flex;align-items:center;gap:8px}
.row.sp{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;border:1px solid var(--ln);background:var(--p2);font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
.chip.sm{padding:4px 9px;font-size:12px}
.seg{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--p3);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font-weight:600;font-size:14px}
.btn.pri{background:var(--ac);color:#1A1206;border-color:var(--ac)}
.btn.ghost{background:transparent}
.btn.dan{color:var(--er)}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn.w{width:100%}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.01em}
.fld input,.fld select,.fld textarea{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:10px 11px;outline:none;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ac)}
.fld input.mm{font-family:var(--mono);font-size:17px;font-weight:500}
.fld small{font-family:var(--mono);font-size:11px;color:var(--mu2)}
.mmwrap{display:flex;align-items:stretch;gap:6px}
.mmwrap input{flex:1}
.mmwrap .u{display:grid;place-items:center;font-family:var(--mono);color:var(--mu);font-size:12px;padding:0 4px}
.stp{display:flex;gap:4px;margin-top:2px}
.stp button{flex:1;padding:6px 0;border-radius:8px;background:var(--p2);border:1px solid var(--ln);font-family:var(--mono);font-size:12px;color:var(--mu)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;flex:none;transition:.2s;margin:0}
.sw:checked{background:var(--ac)}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked:after{left:21px}
.wall{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:10px}
.wall .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--acbg);color:var(--ac);border:1px solid rgba(233,162,59,.35);font-family:var(--mono)}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.it{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:9px;background:var(--p2);border:1px solid var(--ln);font-size:12.5px}
.it i{width:8px;height:8px;border-radius:2px;display:inline-block}
.add{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.add button{flex:none;padding:6px 10px;border-radius:9px;border:1px dashed var(--ln2);color:var(--mu);font-size:12.5px;font-weight:600}
.dirpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:5px;flex:none}
.dirpad button{border-radius:12px;background:var(--acbg);border:1px solid var(--ac);color:var(--ac2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dirpad button b{font-size:22px}.dirpad button span{font-size:9px;margin-top:2px;color:var(--mu)}
.dirpad button:disabled{background:var(--p2);border-color:var(--ln);color:var(--ln2);opacity:.45}
.dirpad .dc{display:grid;place-items:center;border-radius:50%;margin:9px;background:var(--p2);border:1px dashed var(--ln2);font-family:var(--mono);font-weight:800;color:var(--ac)}
.btn:disabled{opacity:.4}
.doorpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doorpick button{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:6px 8px 9px;color:#C9CDD3;display:flex;flex-direction:column;gap:2px;text-align:left}
.doorpick button.on{border-color:var(--ac);background:var(--acbg);color:var(--ac2)}
.doorpick span{font-size:11.5px;line-height:1.25;color:var(--tx)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.shape{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:8px 9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.shape.on{border-color:var(--ac);background:var(--acbg)}
.shape .th{height:86px;margin-bottom:4px}
.shape b{font-size:13.5px}.shape span{font-size:11px;color:var(--mu);line-height:1.25}
.stick{position:sticky;top:0;z-index:3;padding-top:10px;margin:8px 0 4px;background:linear-gradient(var(--bg) 88%,transparent)}
.help{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;margin:10px 0 0;font-size:13.5px}
.help summary{font-weight:700;cursor:pointer;color:var(--ac2)}
.help ol{margin:10px 0 2px;padding-left:20px;color:var(--mu)}.help li{margin:5px 0}.help b{color:var(--tx)}
.wthumb{width:66px;height:56px;flex:none;background:var(--p2);border-radius:10px;border:1px solid var(--ln);padding:3px}
.wall.on{border-color:rgba(233,162,59,.55);box-shadow:0 0 0 1px rgba(233,162,59,.25)}
.wall .hd{cursor:pointer}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:13.5px;border:1px solid}
.banner.ok{background:rgba(92,194,138,.08);border-color:rgba(92,194,138,.35)}
.banner.wa{background:rgba(233,194,59,.08);border-color:rgba(233,194,59,.35)}
.banner.er{background:rgba(239,106,94,.09);border-color:rgba(239,106,94,.4)}
.banner b{font-family:var(--mono)}
.chk{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);font-size:13.5px;text-align:left;width:100%}
.chk:last-child{border-bottom:0}
.chk .d{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.err{background:var(--er)}.warn{background:var(--wa)}.info{background:var(--bl)}.okd{background:var(--ok)}
/* canvas views */
.stage{position:absolute;inset:0;display:flex;flex-direction:column}
.stage .bar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln);background:var(--p1);flex:none;align-items:center}
.stage .cv{flex:1;position:relative;min-height:0;touch-action:none}
svg.plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fab{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.fab button{width:44px;height:44px;border-radius:14px;background:rgba(26,31,38,.92);border:1px solid var(--ln);display:grid;place-items:center;backdrop-filter:blur(8px)}
.hint{position:absolute;left:12px;bottom:12px;right:70px;font-size:12px;color:var(--mu);background:rgba(19,23,28,.88);border:1px solid var(--ln);padding:8px 10px;border-radius:10px;backdrop-filter:blur(8px);pointer-events:none}
.drawer{flex:none;max-height:42%;overflow:auto;border-top:1px solid var(--ln);background:var(--p1);padding:10px 12px 14px}
.scale{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px;pointer-events:none}
.scale i{display:block;height:6px;border:1.5px solid var(--mu);border-top:0}
/* 3D */
#v3host{position:absolute;inset:0;background:#0C0E11}
#v3host canvas{width:100%!important;height:100%!important;display:block;touch-action:none}
.v3top{position:absolute;left:10px;right:10px;top:10px;z-index:2}
.v3bot{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.glass{background:rgba(19,23,28,.86);border:1px solid var(--ln);border-radius:14px;backdrop-filter:blur(10px)}
.v3panel{padding:10px 12px;display:none}
.v3panel.on{display:block}
.rng{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mu);padding:4px 0}
.rng input{flex:1;accent-color:var(--ac)}
.rng b{font-family:var(--mono);color:var(--tx);font-weight:500;min-width:62px;text-align:right}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;pointer-events:none}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86dvh;background:var(--p1);border-top:1px solid var(--ln2);border-radius:22px 22px 0 0;transform:translateY(104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheetWrap.on{pointer-events:auto}
#sheetWrap.on #backdrop{opacity:1}
#sheetWrap.on #sheet{transform:none}
@media (min-width:900px){#sheet{left:auto;right:16px;bottom:16px;top:72px;width:420px;max-height:none;border-radius:20px;border:1px solid var(--ln2)}#backdrop{background:rgba(0,0,0,.25)}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--ln)}
.sh-h h3{flex:1}
.sh-h:before{content:'';position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--ln2)}
.sh-b{overflow:auto;padding:14px 16px 20px;flex:1}
.sh-f{padding:10px 16px 14px;border-top:1px solid var(--ln);display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%) translateY(20px);background:#F1EEE8;color:#15171A;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%)}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat button{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.cat svg{width:100%;height:74px}
.cat b{font-size:13px}.cat span{font-size:11.5px;color:var(--mu);font-family:var(--mono)}
.sw8{display:flex;gap:6px;flex-wrap:wrap}
.sw8 button{width:34px;height:34px;border-radius:10px;border:2px solid transparent;box-shadow:0 0 0 1px var(--ln) inset}
.sw8 button.on{border-color:var(--ac)}
.ficha{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.ficha:last-child{border-bottom:0}
.ficha .sq{width:56px;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.ficha b{display:block;font-size:14px}
.ficha span{font-size:12.5px;color:var(--mu)}
.colls{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.coll{flex:none;width:150px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:var(--p2);text-align:left}
.coll.on{border-color:var(--ac)}
.coll .pv{height:86px;display:grid;grid-template-columns:2fr 1fr}
.coll .pv div{height:100%}
.coll .nm{padding:8px 10px;font-weight:700;font-size:13px}
.coll .nm span{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
.drop{border:1.5px dashed var(--ln2);border-radius:16px;padding:22px;text-align:center;color:var(--mu);display:block;cursor:pointer}
.drop b{color:var(--tx);display:block;margin:6px 0 2px;font-size:15px}
.refimg{width:100%;border-radius:14px;display:block;max-height:300px;object-fit:cover}
.palette{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:10px}
/* documento */
.doc{background:#fff;color:#151515;border-radius:6px;padding:28px 24px;margin-bottom:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.doc h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a6a2c;margin:0 0 4px}
.doc h3{font-size:20px;margin-bottom:12px;color:#111}
.doc p{font-size:13.5px;line-height:1.55;color:#2a2a2a}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th,.doc td{text-align:left;padding:6px 6px;border-bottom:1px solid #e4e2dd}
.doc th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#777}
.doc td.m{font-family:var(--mono)}
.doc svg{width:100%;height:auto;display:block}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px}
.doc .meta span{color:#777;display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.doc .cv3{width:100%;border-radius:4px}
.doc .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--p3);color:var(--mu)}
.muted{color:var(--mu)}
.mono{font-family:var(--mono)}
.sp8{height:8px}.sp14{height:14px}
textarea.code{font-family:var(--mono);font-size:11.5px;min-height:160px}
@media print{body{background:#fff}#top,#tabs,.noprint{display:none!important}#app{display:block;height:auto}main{overflow:visible}.doc{box-shadow:none;page-break-after:always;margin:0}}

/* ---------------- Geometría ---------------- */
function geo(P){const W=P.room.walls,n=W.length;let x=0,y=0,h=0;const ws=[],pts=[];
 for(let i=0;i<n;i++){const L=+W[i].len||0,ang=+W[i].ang||90;const u=[Math.cos(h),Math.sin(h)];const a=[x,y];pts.push(a);x+=u[0]*L;y+=u[1]*L;
  ws.push({i,a,b:[x,y],u,n:[u[1],-u[0]],len:L,ang,h:+W[i].h||+P.room.height});h-=(180-ang)*Math.PI/180}
 const err=Math.hypot(x,y);const sumA=W.reduce((s,w)=>s+(+w.ang||90),0),angErr=sumA-180*(n-2);
 let area=0;for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];area+=p[0]*q[1]-q[0]*p[1]}area=Math.abs(area)/2;
 const t=+P.room.thickness||120;const oc=[];
 for(let i=0;i<n;i++){const w=ws[i],pw=ws[(i-1+n)%n];const A=[w.a[0]-w.n[0]*t,w.a[1]-w.n[1]*t],B=[pw.a[0]-pw.n[0]*t,pw.a[1]-pw.n[1]*t];oc.push(lineX(A,w.u,B,pw.u)||A)}
 let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1]});
 return{ws,pts,err,angErr,area,per:W.reduce((s,w)=>s+(+w.len||0),0),oc,end:[x,y],c:[cx/n,cy/n],t}}
function lineX(p,u,q,v){const d=u[0]*v[1]-u[1]*v[0];if(Math.abs(d)<1e-9)return null;const t=((q[0]-p[0])*v[1]-(q[1]-p[1])*v[0])/d;return[p[0]+u[0]*t,p[1]+u[1]*t]}
const W2=(w,off,dn=0)=>[w.a[0]+w.u[0]*off+w.n[0]*dn,w.a[1]+w.u[1]*off+w.n[1]*dn];
const rectW=(w,o0,len,d0,d1)=>[W2(w,o0,d0),W2(w,o0+len,d0),W2(w,o0+len,d1),W2(w,o0,d1)];
function islandRect(m,ext=0,side=0){const r=(m.rot||0)*Math.PI/180,u=[Math.cos(r),Math.sin(r)],n=[u[1],-u[0]];const hw=m.w/2,hd=(m.d||900)/2;
 const P=(s,t)=>[m.x+u[0]*s+n[0]*t,m.y+u[1]*s+n[1]*t];
 if(side===1)return[P(-hw,hd),P(hw,hd),P(hw,hd+ext),P(-hw,hd+ext)];
 if(side===-1)return[P(-hw,-hd-ext),P(hw,-hd-ext),P(hw,-hd),P(-hw,-hd)];
 return[P(-hw,-hd),P(hw,-hd),P(hw,hd),P(-hw,hd)]}
function footprint(m,P,G){if(m.cat==='isla')return islandRect(m);const w=G.ws[m.wall];if(!w)return null;return rectW(w,m.off,m.w,0,mbox(m,P).d)}
function polyHit(A,B){if(!A||!B)return false;for(const Pp of[A,B]){for(let i=0;i<Pp.length;i++){const p=Pp[i],q=Pp[(i+1)%Pp.length];let ax=q[1]-p[1],ay=p[0]-q[0];const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;let a1=1e18,a2=-1e18,b1=1e18,b2=-1e18;
 for(const v of A){const s=v[0]*ax+v[1]*ay;if(s<a1)a1=s;if(s>a2)a2=s}for(const v of B){const s=v[0]*ax+v[1]*ay;if(s<b1)b1=s;if(s>b2)b2=s}
 if(a2<=b1+0.5||b2<=a1+0.5)return false}}return true}
const ov=(a0,a1,b0,b1)=>a0<b1-0.5&&b0<a1-0.5;
function doorSwings(P,G){const out=[];P.openings.forEach(o=>{if(o.type!=='puerta'||o.swing==='fuera'||o.kind==='corredera')return;const w=G.ws[o.wall];if(!w)return;
 const r=o.kind==='plegable'?o.w/2:o.w;const hOff=o.hinge==='izq'?o.off:o.off+o.w;const v=o.hinge==='izq'?w.u:[-w.u[0],-w.u[1]];const H=W2(w,hOff,0);const poly=[H];
 for(let k=0;k<=6;k++){const th=k/6*Math.PI/2;poly.push([H[0]+r*(Math.cos(th)*v[0]+Math.sin(th)*w.n[0]),H[1]+r*(Math.cos(th)*v[1]+Math.sin(th)*w.n[1])])}
 out.push({o,poly})});return out}
function codes(P){const m={},pre={bajo:'B',alto:'A',col:'C',isla:'I'},cnt={};[...P.mods].sort((a,b)=>(a.wall??99)-(b.wall??99)||(a.off||0)-(b.off||0)).forEach(x=>{const p=pre[x.cat];cnt[p]=(cnt[p]||0)+1;m[x.id]=p+cnt[p]});return m}

/* ---------------- Presets de geometría ---------------- */
function preset(kind,W,L){W=+W||3600;L=+L||2800;
 if(kind==='rectangular')return[W,L,W,L].map(len=>({len,ang:90}));
 if(kind==='cuadrada')return[W,W,W,W].map(len=>({len,ang:90}));
 if(kind==='L'){const a=Math.round(W*.55/10)*10,b=Math.round(L*.42/10)*10;return[{len:W,ang:90},{len:L-b,ang:90},{len:W-a,ang:270},{len:b,ang:90},{len:a,ang:90},{len:L,ang:90}]}
 if(kind==='U'){const nn=Math.round(W*.3/10)*10,c=(W-nn)/2,dn=Math.round(L*.28/10)*10;return[{len:W,ang:90},{len:L,ang:90},{len:c,ang:90},{len:dn,ang:270},{len:nn,ang:270},{len:dn,ang:90},{len:c,ang:90},{len:L,ang:90}]}
 return[{len:W,ang:90},{len:L,ang:95},{len:Math.round(W-L*Math.tan(5*Math.PI/180)),ang:85},{len:Math.round(L/Math.cos(5*Math.PI/180)),ang:90}]}
function closeLast(P){const W=P.room.walls,n=W.length;if(n<3)return;let x=0,y=0,h=0;for(let i=0;i<n-1;i++){const L=+W[i].len;x+=Math.cos(h)*L;y+=Math.sin(h)*L;if(i<n-2)h-=(180-(+W[i].ang||90))*Math.PI/180}
 const d=Math.atan2(-y,-x);const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<=-Math.PI)a+=2*Math.PI;return a};

function frontLayout(m,P,wallLen){const e=E(P),W=m.w,out=[],b=mbox(m,P);const dbl=(x,y,w,h,type='door')=>{if(w>=650){out.push({x,y,w:w/2,h,type,hinge:'l'},{x:x+w/2,y,w:w/2,h,type,hinge:'r'})}else out.push({x,y,w,h,type,hinge:m.off+w/2>(wallLen||1e9)/2?'r':'l'})};

   case 'horno_bajo':out.push({x:0,y:y1-595,w:W,h:595,type:'glass'},{x:0,y:y0,w:W,h:H-595,type:'drawer'});break;
   case 'esquina':{const right=wallLen&&m.off+m.w>wallLen-50;const bw=W-500;if(right){out.push({x:0,y:y0,w:500,h:H,type:'door',hinge:'l'},{x:500,y:y0,w:bw,h:H,type:'blind'})}else{out.push({x:0,y:y0,w:bw,h:H,type:'blind'},{x:bw,y:y0,w:500,h:H,type:'door',hinge:'r'})}break}
   case 'botellero':out.push({x:0,y:y0,w:W,h:H,type:'rack'});break;

   default:dbl(0,y0,W,H)}}

  switch(m.kind){case 'campana':out.push({x:0,y:y0+110,w:W,h:H-110,type:'door',hinge:'t'},{x:0,y:y0,w:W,h:110,type:'hood'});break;

 <div class="sp14"></div><div class="banner wa" style="font-size:12.5px">El reconocimiento de tirador y diseño de puerta es orientativo; para un análisis semántico completo (tipo de tirador, marca de colección) la versión instalada conectaría con un modelo de visión.</div></div>`;
 $('#imgIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{S.match=analyzeImage(img);const c=document.createElement('canvas');const k=Math.min(1,420/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.match.thumb=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);renderMatch()};img.src=url};
 if(S.match)renderMatch();else if(S.P.refImg)$('#matchOut').innerHTML=`<div class="sp14"></div><img class="refimg" src="${S.P.refImg}" alt="Referencia guardada"><p class="sub">Referencia guardada en el proyecto.</p>`}
function analyzeImage(img){const c=document.createElement('canvas');const sc=Math.min(1,160/Math.max(img.width,img.height));const W=c.width=Math.max(8,Math.round(img.width*sc)),H=c.height=Math.max(8,Math.round(img.height*sc));const x=c.getContext('2d');x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data;const N=W*H;
 const px=new Float32Array(N*3);for(let i=0;i<N;i++){px[i*3]=d[i*4];px[i*3+1]=d[i*4+1];px[i*3+2]=d[i*4+2]}const lum=i=>px[i*3]*.3+px[i*3+1]*.59+px[i*3+2]*.11;
 const k=7;const idx=[...Array(N).keys()].sort((a,b)=>lum(a)-lum(b));const C=[];for(let j=0;j<k;j++){const i=idx[Math.floor((j+.5)/k*N)];C.push([px[i*3],px[i*3+1],px[i*3+2]])}
 const lab=new Uint8Array(N);for(let it=0;it<10;it++){const sm=C.map(()=>[0,0,0,0]);for(let i=0;i<N;i++){let bd=1e12,bj=0;for(let j=0;j<k;j++){const a=px[i*3]-C[j][0],b=px[i*3+1]-C[j][1],cc=px[i*3+2]-C[j][2];const dd=a*a*.3+b*b*.59+cc*cc*.11;if(dd<bd){bd=dd;bj=j}}lab[i]=bj;const s=sm[bj];s[0]+=px[i*3];s[1]+=px[i*3+1];s[2]+=px[i*3+2];s[3]++}C.forEach((cc,j)=>{const s=sm[j];if(s[3]){cc[0]=s[0]/s[3];cc[1]=s[1]/s[3];cc[2]=s[2]/s[3]}})}
 const cnt=new Array(k).fill(0),grad=new Array(k).fill(0),gx=new Array(k).fill(0),gy=new Array(k).fill(0);for(let y=0;y<H-1;y++)for(let xx=0;xx<W-1;xx++){const i=y*W+xx,j=lab[i];cnt[j]++;const a=Math.abs(lum(i)-lum(i+1)),b=Math.abs(lum(i)-lum(i+W));gx[j]+=a;gy[j]+=b;grad[j]+=a+b}
 const band=(y0,y1,ex=[])=>{const h=new Array(k).fill(0);for(let y=Math.floor(H*y0);y<Math.floor(H*y1);y++)for(let xx=Math.floor(W*.08);xx<W*.92;xx++){const j=lab[y*W+xx];if(!ex.includes(j))h[j]++}return h.indexOf(Math.max(...h))};
 const floor=band(.86,1),wall=band(0,.22),front=band(.55,.86,[floor]),counter=band(.44,.57,[front,floor]);
 const hsl=([r,g,b])=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const dd=mx-mn;s=l>.5?dd/(2-mx-mn):dd/(mx+mn);h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h*=60}return[h,s,l]};
 const L=C.map(c=>hsl(c)[2]);const share=cnt.map(v=>v/N);let handle=pickMin(C.map((c,j)=>j).filter(j=>share[j]<.09&&j!==front),j=>L[j]);if(handle==null)handle=L.indexOf(Math.min(...L));
 let hi=0,hiT=0;for(let y=Math.floor(H*.45);y<H*.9;y++)for(let xx=0;xx<W;xx++){const i=y*W+xx;hiT++;const[,s,l]=hsl([px[i*3],px[i*3+1],px[i*3+2]]);if(l>.9&&s<.15)hi++}const hr=hi/hiT;
 const finish=hr>.05?'brillo':hr>.018?'satinado':'mate';const tex=j=>{const[h,s,l]=hsl(C[j]);const g=grad[j]/Math.max(1,cnt[j]);const dirn=Math.max(gx[j],gy[j])/Math.max(1,Math.min(gx[j],gy[j]));if(h>15&&h<48&&s>.18&&l>.15&&l<.75&&g>5)return'madera';if(g>9&&dirn<1.4)return'piedra';return null};
 const ft=tex(front)||(finish==='brillo'?'lacado':'liso');const ct=tex(counter)==='madera'?'madera':(grad[counter]/Math.max(1,cnt[counter])>4?'piedra':'liso');const flt=tex(floor)==='madera'?'madera':(grad[floor]/Math.max(1,cnt[floor])>6?'baldosa':'microcemento');

 return{pal:C.map((c,j)=>({hex:rgb2hex(...c),share:share[j]})),roles:{front,counter,wall,floor,handle},finish,tex:{front:ft,counter:ct,floor:flt},light,style,handle:L[handle]<.3?'barra':'perfil',design:'liso',hr}}

  <tr><td><span class="sw" style="background:${F.floor.color}"></span>Suelo</td><td>${nearestName(F.floor.color)} · ${F.floor.texture}</td><td class="m">${F.floor.color}</td></tr></tbody></table>${P.refImg?`<p style="margin-top:14px;font-size:12px;color:#777">Fotografía de referencia</p><img src="${P.refImg}" style="width:50%;border-radius:4px">`:''}</div>
 <div class="doc"><h4>Memoria</h4><h3>Memoria del proyecto</h3>${memoria(P)}</div></div>`}


/* ---------------- Versión y actualización (sin tocar los proyectos) ---------------- */
const enClaude=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const FICHEROS_APP=['./','index.html','sw.js','manifest.webmanifest','icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png'];
async function versionRemota(){const txt=await(await fetch('index.html?nc='+Date.now(),{cache:'no-store'})).text();const m=txt.match(/const VERSION='([^']+)'/);return m?m[1]:''}
async function actualizarApp(forzar){const btn=$('#upd');
 if(enClaude){toast('Dentro de Claude la app ya está siempre en la última versión ('+VERSION+')');return}
 if(!navigator.onLine){toast('Sin conexión. Conéctate y vuelve a pulsar ↻');return}
 btn.classList.add('girando');
 try{const nueva=await versionRemota();
  if(!forzar&&nueva&&nueva===VERSION){btn.classList.remove('girando');confirmBox(`Ya tienes la última versión (<b>${VERSION}</b>). ¿Recargar la app de todos modos?`,()=>actualizarApp(true),'Recargar');return}
  saveStore();
  await Promise.all(FICHEROS_APP.map(f=>fetch(f,{cache:'reload'}).catch(()=>null)));
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
  try{sessionStorage.setItem('actualizadoDesde',VERSION)}catch(e){}
  location.replace(location.pathname+'?v='+Date.now()+location.hash)}
 catch(e){btn.classList.remove('girando');toast('No se pudo actualizar: '+e.message)}}
async function comprobarNueva(){if(enClaude||!navigator.onLine||location.protocol!=='https:')return;try{const v=await versionRemota();if(v&&v!==VERSION){$('#upd').classList.add('nueva');toast('Hay una versión nueva ('+v+'): toca ↻')}}catch(e){}}
function aboutSheet(){openSheet('Cocinas Pro',`<div class="row" style="gap:12px"><span class="logo"><span class="mark" style="width:40px;height:40px;border-radius:11px"></span></span><div><b style="font-size:17px">Versión ${VERSION}</b><div class="sub">${enClaude?'Abierta dentro de Claude':'App instalada · GitHub Pages'}</div></div></div>
 <div class="sp14"></div><div class="card" style="background:var(--p2);font-size:13.5px;color:var(--mu)">El botón <b style="color:var(--tx)">↻</b> descarga la última versión desde GitHub y recarga la app. <b style="color:var(--tx)">Tus proyectos no se borran</b>: se guardan aparte en este dispositivo. Cuando hay una versión nueva, el botón se pone en ámbar con un punto rojo.</div>
 <div class="sp14"></div><h2 style="margin-top:0">Novedades</h2><div class="card" style="font-size:13px">
 <p style="margin:0 0 6px"><b class="mono">v1.6</b> · El dibujo en curso se ve en Plano y Medir, se guarda solo y se puede retomar.</p>
 <p style="margin:0 0 6px"><b class="mono">v1.5</b> · Al dibujar cada pared: puertas, ventanas, huecos, tomas, obstáculos y revestimiento (azulejo…).</p>
 <p style="margin:0 0 6px"><b class="mono">v1.4</b> · Versión visible y botón de actualizar.</p>
 <p style="margin:0 0 6px"><b class="mono">v1.3</b> · Dibujar paredes pared a pared con flechas.</p>
 <p style="margin:0 0 6px"><b class="mono">v1.2</b> · Puertas: mano y apertura con dibujo; desplegables fiables en iPhone.</p>
 <p style="margin:0 0 6px"><b class="mono">v1.1</b> · Plano nuevo desde cero y guía de paredes.</p>
 <p style="margin:0"><b class="mono">v1.0</b> · Primera versión.</p></div>`,`<button class="btn pri w" data-act="update">↻ Buscar actualización</button>`)}

/* ---------------- Arranque ---------------- */
function boot(){const st=loadStore();let p=null;if(st&&st.projects&&st.projects.length)p=st.projects.find(x=>x.id===st.current)||st.projects[0];if(!p)p=defaultProject();
 S.P=p;S.last=JSON.stringify(p);saveStore();loadDraw();const v=location.hash.slice(1);S.view=VIEWS.includes(v)?v:'inicio';render()}
boot();
$('#ver').textContent=VERSION;setTimeout(comprobarNueva,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)comprobarNueva()});
try{const desde=sessionStorage.getItem('actualizadoDesde');if(desde){sessionStorage.removeItem('actualizadoDesde');history.replaceState(null,'',location.pathname+location.hash);setTimeout(()=>toast(desde===VERSION?'App recargada · '+VERSION:'Actualizada de '+desde+' a '+VERSION),400)}}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
